[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagegem"
version = "0.1.0"
description = "Sistema de geração de prompts hiper-realistas para Nano Banana Pro"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Raphael Vianna" }]
dependencies = [
    "jsonschema>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.9"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
imagegem = "imagegem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
